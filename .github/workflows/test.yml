name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Core
            directory: .
          - name: Infra example
            directory: examples/infra
          - name: OpenShift operator example
            directory: examples/openshift
          - name: Crossplane example
            directory: examples/crossplane
    defaults:
      run:
        working-directory: ${{ matrix.directory }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version-file: ${{ matrix.directory }}/go.mod
          cache-dependency-path: |
            go.sum
            ${{ matrix.directory }}/go.sum
      - name: Check formatting
        run: test -z "$(gofmt -l .)"
      - name: Run tests with race detection
        run: go test -race ./...
