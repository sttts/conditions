name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  infra:
    name: Infra example
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: examples/infra
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version-file: examples/infra/go.mod
          cache-dependency-path: examples/infra/go.sum
      - name: Check formatting
        run: test -z "$(gofmt -l .)"
      - name: Run tests with race detection
        run: go test -race ./...
